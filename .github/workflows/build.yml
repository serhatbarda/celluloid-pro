# Reafilm Pro - CI / release (SPEC §11).
#
# Exactly two jobs: macOS (universal arm64+x86_64, Metal) and Windows (MSVC x64, CUDA, OpenCL).
# There is deliberately NO Linux job: unit tests, POCL GPU parity and host render tests run on the
# Linux development workbench.
#
# Build variant: the PERSONAL build (default, CEL_LICENSING=OFF: no license check, no trial
# watermark, LUT export always on) - the owner's own non-commercial build. The licensed variant
# (-DCEL_LICENSING=ON) is built by a manual run with the "licensing" input switched on.
#
# Every push/PR builds both installers and uploads them as workflow artifacts. A tag "v*" (e.g.
# v1.0.0, must match the project version in CMakeLists.txt) also publishes both installers together
# from the "release" job; the release licence gate runs only for licensed builds (a personal build
# has no license keys to check).
#
# Signing is optional and switched on by repository secrets:
#   macOS:   MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
#            MACOS_INSTALLER_CERT_P12 (base64 Developer ID Installer .p12; same password),
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (notarization)
#   Windows: WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD
# Without them the macOS plug-in is ad-hoc signed and the installers are unsigned.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      licensing:
        description: 'Licensed build (-DCEL_LICENSING=ON: license keys, trial watermark) instead of the personal build'
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release
  # OFF = personal build (default); ON only for a manual run with the "licensing" input
  CEL_LICENSING: ${{ (github.event_name == 'workflow_dispatch' && inputs.licensing) && 'ON' || 'OFF' }}

jobs:
  macos:
    name: macOS universal (Metal)
    runs-on: macos-14
    timeout-minutes: 120
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: ver
        shell: bash
        run: bash installers/ci/version.sh

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          if ! xcrun -sdk macosx -f metal >/dev/null 2>&1; then
            echo "Metal compiler missing - downloading the Metal toolchain component"
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version || true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCEL_ENABLE_METAL=ON
          -DCEL_ENABLE_OPENCL=ON
          -DCEL_BUILD_TESTS=ON
          -DCEL_LICENSING=${CEL_LICENSING}
          -DCEL_BUILD_ID=${{ steps.ver.outputs.build_id }}

      - name: Build
        run: cmake --build build --config ${BUILD_TYPE} --parallel 4

      - name: Metal syntax check (offline compile of the flattened MSL)
        run: |
          cmake --build build --target celgpu_kernel_sources
          shopt -s nullglob
          files=(build/src/gpu/generated/*.metal build/tests/gpu/generated/*.metal)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no flattened .metal sources found"; exit 1; }
          if [ -f tests/gpu/metal_syntax/check_metal.sh ]; then
            bash tests/gpu/metal_syntax/check_metal.sh "${files[@]}"
          else
            for f in "${files[@]}"; do
              xcrun -sdk macosx metal -std=macos-metal2.3 -mmacosx-version-min=11.0 -fno-fast-math \
                -c "$f" -o "$RUNNER_TEMP/$(basename "$f" .metal).air"
              echo "Metal source compiles: $f"
            done
          fi

      - name: Verify bundle
        run: bash installers/ci/verify_bundle.sh build/ReafilmPro.ofx.bundle macos

      # Licensed builds on tags only (never main/PR builds, never the personal build): no provisional
      # production key, no CEL_DEV_LICENSE build, no development public key in the binary
      - name: Release licence gate
        if: startsWith(github.ref, 'refs/tags/v') && env.CEL_LICENSING == 'ON'
        run: bash installers/ci/release_gate.sh build build/ReafilmPro.ofx.bundle

      - name: Unit tests
        run: ctest --test-dir build -C ${BUILD_TYPE} --output-on-failure --timeout 900 -LE "gpu-device|linux-only"

      # Runs the GPU backends on the runner's own GPU when it exposes one (Metal and Apple's
      # OpenCL on the Apple-silicon VM): backend ABI tests, production self tests and CPU vs GPU
      # parity of every plan. Without a usable device the tests report SKIP (exit 77).
      - name: GPU device tests (Metal / OpenCL, skipped without a device)
        run: |
          system_profiler SPDisplaysDataType 2>/dev/null | sed -n '1,20p' || true
          ctest --test-dir build -C ${BUILD_TYPE} -V --timeout 1200 -L gpu-device

      - name: Import signing certificates
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/celluloid-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          if [ -n "$MACOS_INSTALLER_CERT_P12" ]; then
            echo "$MACOS_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
            security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP"/*.p12
          APP_ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          INST_ID=$(security find-identity -v "$KC" | grep "Developer ID Installer" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "APP_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"
          echo "Signing identities: app='$APP_ID' installer='$INST_ID'"

      - name: Package (.pkg)
        run: |
          args=(--bundle build/ReafilmPro.ofx.bundle --version "${{ steps.ver.outputs.version }}" --out dist)
          [ -n "${APP_IDENTITY:-}" ] && args+=(--app-identity "$APP_IDENTITY")
          [ -n "${INSTALLER_IDENTITY:-}" ] && args+=(--installer-identity "$INSTALLER_IDENTITY")
          [ -n "${KEYCHAIN:-}" ] && args+=(--keychain "$KEYCHAIN")
          [ "$CEL_LICENSING" = "ON" ] && args+=(--licensed)
          if [ -n "${INSTALLER_IDENTITY:-}" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            args+=(--notarize)
          fi
          bash installers/macos/build_pkg.sh "${args[@]}"

      - name: Disk image (.dmg with the installer)
        run: |
          VER="${{ steps.ver.outputs.version }}"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp dist/*.pkg "$STAGE/"
          [ -f docs/MANUAL.md ] && cp docs/MANUAL.md "$STAGE/Manual.md"
          cat > "$STAGE/READ ME FIRST.txt" <<EOF
          Reafilm Pro $VER for DaVinci Resolve (macOS 11+, Apple silicon and Intel)

          1. Quit DaVinci Resolve.
          2. Double-click ReafilmPro-$VER-macOS.pkg and follow the installer.
             The plug-in is installed to /Library/OFX/Plugins/ReafilmPro.ofx.bundle.
          3. Start Resolve; the effect is under OpenFX > Reafilm > Reafilm Pro.

          Upgrading from Celluloid Pro: the installer removes the old
          /Library/OFX/Plugins/Celluloid.ofx.bundle. If you installed it by hand, delete
          that folder yourself, otherwise Resolve shows both. Saved projects keep loading.

          If the installer is not signed yet, macOS may block it: right-click the
          .pkg and choose Open, or allow it in System Settings > Privacy & Security.
          EOF
          if [ "$CEL_LICENSING" = "ON" ]; then
            echo "Without a license key the plug-in runs as a full trial with a watermark." >> "$STAGE/READ ME FIRST.txt"
          else
            echo "Personal build for non-commercial use: no license key needed, no watermark." >> "$STAGE/READ ME FIRST.txt"
          fi
          hdiutil create -volname "Reafilm Pro $VER" -srcfolder "$STAGE" -fs HFS+ \
            -format UDZO -ov "dist/ReafilmPro-$VER-macOS.dmg"
          if [ -n "${APP_IDENTITY:-}" ]; then
            codesign --force --sign "$APP_IDENTITY" ${KEYCHAIN:+--keychain "$KEYCHAIN"} --timestamp "dist/ReafilmPro-$VER-macOS.dmg"
          fi
          hdiutil verify "dist/ReafilmPro-$VER-macOS.dmg"
          ls -la dist

      - name: Clean up keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@v7
        with:
          name: ReafilmPro-${{ steps.ver.outputs.version }}-macOS
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64 (CUDA, OpenCL)
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: ver
        run: bash installers/ci/version.sh

      - name: CUDA toolkit
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.1'          # last CUDA line that still builds sm_52..sm_72 (SPEC §8: sm_52..sm_90 + PTX)
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: false

      # vcvars64 via vswhere (no third-party action; exports only what vcvars changes)
      - name: MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the x64 C++ tools not found" }
          $bat = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $lines = cmd /c "`"$bat`" >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($l in $lines) {
            if ($l -match '^([^=]+)=(.*)$') {
              $n = $matches[1]; $v = $matches[2]
              if ($n -like 'GITHUB_*' -or $n -like 'RUNNER_*') { continue }
              if ([Environment]::GetEnvironmentVariable($n) -ne $v) { "$n=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
            }
          }
          Write-Host "MSVC environment from $bat"

      - name: Toolchain
        run: |
          cmake --version
          nvcc --version
          which ninja || choco install ninja -y --no-progress
          ninja --version
          echo "CUDA_PATH=$CUDA_PATH"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_CUDA_COMPILER="$(cygpath -m "$CUDA_PATH")/bin/nvcc.exe"
          -DCEL_ENABLE_CUDA=ON
          -DCEL_ENABLE_OPENCL=ON
          -DCEL_BUILD_TESTS=ON
          -DCEL_LICENSING=${CEL_LICENSING}
          -DCEL_BUILD_ID=${{ steps.ver.outputs.build_id }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Verify bundle
        run: bash installers/ci/verify_bundle.sh build/ReafilmPro.ofx.bundle windows

      - name: Release licence gate
        if: startsWith(github.ref, 'refs/tags/v') && env.CEL_LICENSING == 'ON'
        run: bash installers/ci/release_gate.sh build build/ReafilmPro.ofx.bundle

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --timeout 900 -LE "gpu-device|linux-only"

      # The hosted runner has no GPU: this proves that the CUDA/OpenCL runtimes are probed
      # gracefully (self tests report "not usable", tests SKIP) and runs them if a device appears.
      - name: GPU device tests (CUDA / OpenCL, skipped without a device)
        run: ctest --test-dir build --output-on-failure --timeout 1200 -L gpu-device

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          } else {
            choco upgrade innosetup -y --no-progress   # the script needs Inno Setup >= 6.3
          }

      - name: Package (Inno Setup installer, optional Authenticode)
        shell: pwsh
        run: |
          $pfx = ""
          if ($env:WINDOWS_CERT_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP "celluloid-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          }
          try {
            ./installers/windows/build_installer.ps1 -BundleDir build/ReafilmPro.ofx.bundle `
              -Version "${{ steps.ver.outputs.version }}" -OutDir dist -CertPfx $pfx -CertPassword "$env:WINDOWS_CERT_PASSWORD"
          } finally {
            if ($pfx -and (Test-Path $pfx)) { Remove-Item -Force $pfx }
          }

      - name: Zip the bundle (manual installs)
        shell: pwsh
        run: Compress-Archive -Path build/ReafilmPro.ofx.bundle -DestinationPath "dist/ReafilmPro-${{ steps.ver.outputs.version }}-Windows-bundle.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ReafilmPro-${{ steps.ver.outputs.version }}-Windows
          path: dist/*
          if-no-files-found: error

  # Tags only: one job publishes the release after BOTH platforms built, passed their tests and
  # (licensed builds) their licence gates, so a release is never half-populated.
  release:
    name: GitHub Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: ReafilmPro-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          bash installers/ci/release_upload.sh "${GITHUB_REF_NAME}" dist/*
